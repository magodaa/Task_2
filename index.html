<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>نظام إدارة نتائج الطلاب</title>
</head>
<body>
  <h2> لمشاهدة نتائج الطلاب</h2>

  <script>
    
    // 1. هيكلة بيانات الطالب (Class & Constructor)

class Student {
  constructor(id, name, grades, attendance) {
    this.id = id;                
    this.name = name;             
    this.grades = grades;         
    this.attendance = attendance; 
  }

  // 2. دوال التحليل الأكاديمي (Methods)

  // حساب المتوسط باستخدام reduce

  calculateAverage() {
    const total = this.grades.reduce((sum, grade) => sum + grade, 0);
    return total / this.grades.length;
  }

  // تحديد التقدير بالحروف
  
  getGrade(average) {
    if (average >= 90) {
      return "A";
    } else if (average >= 80) {
      return "B";
    } else if (average >= 70) {
      return "C";
    } else if (average >= 60) {
      return "D";
    } else if (average >= 50) {
      return "E";
    } else {
      return "F";
    }
  }

  // النتيجة النهائية باستخدام &&

  getFinalResult() {
    const average = this.calculateAverage();
    if (average >= 50 && this.attendance >= 75) {
      return "ناجح";
    } else {
      return "يحتاج مراجعة";
    }
  }
}

// 3. نظام تشغيل الجامعة (Objects Array)

const studentsList = [
  new Student(101, "Magda",  [90, 85, 95], 92),  
  new Student(102, "Laila",   [45, 40, 48], 80),  
  new Student(103, "Ahmed",  [42, 47, 41], 70),  
  new Student(104, "Ali", [70, 65, 75], 85)  
];

// 4. لجنة الرأفة (Array Methods)

// الاستخراج: filter للطلاب بمتوسط بين 40 و 49

const faildStudents = studentsList.filter((student) => {
  const avg = student.calculateAverage();
  return avg >= 40 && avg <= 49;
});

// المعالجة: map لإضافة 5 درجات رأفة لمتوسط كل طالب متعثر
const mercyResults = faildStudents.map((student) => {
  return {
    id: student.id,
    name: student.name,
    originalAverage: Number(student.calculateAverage().toFixed(2)),
    newAverage: Number((student.calculateAverage() + 5).toFixed(2))
  };
});

// التحليل: reduce لجمع المتوسطات الجديدة
const totalNewAverages = mercyResults.reduce((sum, student) => {
  return sum + student.newAverage;
}, 0);

// متوسط الرأفة مع درع الحماية من القسمة على صفر
let mercyAverage;
if (mercyResults.length === 0) {
  mercyAverage = 0; // درع الحماية
} else {
  mercyAverage = totalNewAverages / mercyResults.length;
}

// 5. المخرجات (Console Logging)

console.log(" تقرير الطلاب ");
studentsList.forEach((student) => {
  const average = student.calculateAverage();
  console.log(
    `الاسم: ${student.name} | المتوسط: ${average.toFixed(2)} | التقدير: ${student.getGrade(average)} | النتيجة: ${student.getFinalResult()}`
  );
});

console.log("\nالطلاب المتعثرون (بعد الرأفة) ");
console.log(mercyResults);

console.log("\n متوسط المتعثرين بعد التعديل ");
console.log(`المتوسط العام: ${mercyAverage.toFixed(2)}`);
  </script>

</body>
</html>
